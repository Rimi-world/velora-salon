
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FAF6F0">
<meta name="description" content="Discover VELORA luxury beauty services. A fictional salon concept by BYTEORA.">
<title>Our Services | VELORA</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
--cream:#FAF6F0;
--white:#FFFDF9;
--pink:#C88F98;
--blush:#F2DFE1;
--dark:#483439;
--gold:#C6A477;
--muted:#86787A;
--ease:cubic-bezier(.22,1,.36,1)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
margin:0;
background:var(--cream);
color:var(--dark);
font-family:Tajawal,sans-serif;
overflow-x:hidden
}
button{font:inherit;cursor:pointer}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}
.container{width:min(1250px,90%);margin:auto}
.eyebrow{
font:700 11px "DM Sans",sans-serif;
letter-spacing:.2em;
color:var(--pink)
}
.btn{
display:inline-flex;
align-items:center;
justify-content:center;
gap:12px;
padding:17px 28px;
background:var(--dark);
border:1px solid var(--dark);
color:white;
font-weight:700;
font-size:14px;
transition:.35s var(--ease)
}
.btn:hover{
background:var(--pink);
border-color:var(--pink);
transform:translateY(-3px)
}
.btn-outline{
background:transparent;
color:var(--dark)
}
.btn-outline:hover{color:white}
.reveal{
opacity:0;
transform:translateY(35px);
transition:opacity .85s var(--ease),transform .85s var(--ease)
}
.reveal.visible{opacity:1;transform:none}
button:focus-visible,a:focus-visible{
outline:2px solid var(--pink);
outline-offset:4px
}

/* NAVIGATION */
header{
position:fixed;
top:0;left:0;right:0;
z-index:100;
background:#FAF6F0F2;
backdrop-filter:blur(16px);
border-bottom:1px solid #4834391C
}
.nav{
min-height:88px;
display:flex;
align-items:center;
justify-content:space-between;
gap:22px
}
.brand{
display:flex;
align-items:center;
gap:10px;
flex-shrink:0
}
.brand img{
width:82px;
height:68px;
object-fit:contain
}
.brand-name{
font:400 23px "Playfair Display",serif;
letter-spacing:.08em
}
.navlinks{
display:flex;
align-items:center;
gap:25px
}
.navlinks a{
font-size:13px;
font-weight:700;
transition:color .3s
}
.navlinks a:hover,.navlinks .current{color:var(--pink)}
.nav-actions{display:flex;align-items:center;gap:12px}
.lang{
background:none;
border:0;
color:var(--dark);
font:700 12px "DM Sans",sans-serif;
padding:10px
}
.menu{
display:none;
background:none;
border:0;
color:var(--dark);
font-size:27px
}

/* HERO */
.hero{
position:relative;
min-height:78svh;
display:flex;
align-items:center;
padding:170px 0 100px;
isolation:isolate;
overflow:hidden
}
.hero-bg{
position:absolute;
inset:0;
z-index:-2;
background:url("https://images.unsplash.com/photo-1560066984-138dadb4c035?w=1800&q=85&auto=format&fit=crop") center/cover
}
.hero:after{
content:"";
position:absolute;
inset:0;
z-index:-1;
background:linear-gradient(90deg,#FAF6F0F7,#FAF6F0DE 65%,#FAF6F075)
}
.hero-content{max-width:760px}
.hero-mark{
width:130px;
height:130px;
object-fit:contain;
margin-bottom:15px
}
.hero h1{
font:400 clamp(65px,10vw,130px)/1.05 "Playfair Display",serif;
letter-spacing:-.05em;
margin:18px 0
}
.hero h1 em{color:var(--pink);font-weight:400}
.hero p{
font-size:18px;
line-height:2;
max-width:550px;
margin:25px 0 35px
}

/* INTRO TEXT */
.intro-section{
padding:110px 0 60px;
text-align:center
}
.intro-section h2{
font:400 clamp(48px,7vw,85px)/1.1 "Playfair Display",serif;
margin:18px 0
}
.intro-section h2 em{color:var(--pink)}
.intro-section p{
color:var(--muted);
font-size:17px;
line-height:2;
max-width:650px;
margin:20px auto
}

/* FILTERS */
.filters{
display:flex;
align-items:center;
justify-content:center;
flex-wrap:wrap;
gap:10px;
margin:30px 0 60px
}
.filter{
padding:13px 20px;
border:1px solid #4834392B;
background:transparent;
color:var(--dark);
font-size:13px;
font-weight:700;
transition:.3s
}
.filter:hover,.filter.active{
background:var(--dark);
color:white;
border-color:var(--dark)
}

/* SERVICE CARDS */
.services-section{padding:0 0 135px}
.service-grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:25px
}
.service-card{
background:var(--white);
border:1px solid #4834391B;
overflow:hidden;
transition:.35s var(--ease)
}
.service-card:hover{
transform:translateY(-6px);
box-shadow:0 20px 40px #48343912
}
.service-image{
height:370px;
overflow:hidden
}
.service-image img{
width:100%;
height:100%;
object-fit:cover;
transition:transform .8s var(--ease)
}
.service-card:hover img{transform:scale(1.05)}
.service-body{padding:35px}
.service-top{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px
}
.service-number{
color:var(--pink);
font:700 11px "DM Sans",sans-serif;
letter-spacing:.15em
}
.service-price{
color:var(--gold);
font:700 13px "DM Sans",sans-serif
}
.service-body h3{
font:400 clamp(32px,4vw,47px) "Playfair Display",serif;
margin:20px 0 15px
}
.service-body p{
color:var(--muted);
line-height:2;
font-size:15px;
min-height:65px
}
.service-details{
display:flex;
flex-wrap:wrap;
gap:10px;
margin:25px 0 30px
}
.service-details span{
padding:9px 12px;
background:var(--blush);
font-size:12px;
color:var(--dark)
}
.service-body .btn{width:100%}
.service-card[hidden]{display:none}

/* PHILOSOPHY */
.philosophy{
background:var(--blush);
padding:130px 0
}
.philosophy-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:80px;
align-items:center
}
.philosophy-image{
height:580px;
overflow:hidden
}
.philosophy-image img{
width:100%;
height:100%;
object-fit:cover
}
.philosophy h2{
font:400 clamp(50px,7vw,90px)/1.1 "Playfair Display",serif;
margin:20px 0
}
.philosophy h2 em{color:var(--pink)}
.philosophy p{
font-size:17px;
color:var(--muted);
line-height:2.1;
margin-bottom:30px
}

/* BOOKING CTA */
.cta{
padding:140px 0;
background:var(--dark);
color:var(--cream);
text-align:center
}
.cta h2{
font:400 clamp(60px,9vw,120px)/1.1 "Playfair Display",serif;
margin:25px 0
}
.cta h2 em{color:#DCA8B0}
.cta p{
color:#E0CCCF;
font-size:17px;
line-height:2;
margin-bottom:35px
}
.cta .btn{
background:var(--cream);
color:var(--dark);
border-color:var(--cream)
}
.cta .btn:hover{
background:var(--pink);
border-color:var(--pink);
color:white
}

/* FOOTER */
footer{
background:#34262A;
color:var(--cream);
padding:65px 0 30px
}
.footer-top{
display:flex;
justify-content:space-between;
gap:35px;
flex-wrap:wrap;
padding-bottom:55px
}
.footer-logo{
width:150px;
height:130px;
object-fit:contain
}
.footer-description{
max-width:330px;
font-size:14px;
